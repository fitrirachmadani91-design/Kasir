<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>MathSolver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    /* BACKGROUND GRADIENT ANIMATED */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 12px;
      background: linear-gradient(-45deg, #7c3aed, #0f172a, #06b6d4, #14b8a6);
      background-size: 300% 300%;
      animation: bg-move 22s ease infinite;
      color: #f9fafb;
    }

    @keyframes bg-move {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .sheet-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 4px;
    }

    .sheet {
      width: 100%;
      border-radius: 26px;
      padding: 16px 16px 18px;
      background: rgba(15,23,42,0.80);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(148,163,184,0.55);
      box-shadow:
        0 22px 55px rgba(15,23,42,0.95),
        0 0 0 1px rgba(15,23,42,0.65);
      position: relative;
      overflow: hidden;
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at top left,
                  rgba(129, 140, 248, 0.22),
                  transparent 55%);
      opacity: 0.9;
      pointer-events: none;
    }

    /* JUDUL – MENYALA */
    h1 {
      font-size: 1.1rem;
      text-align: center;
      margin: 0 0 4px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(129,140,248,0.9),
        0 0 18px rgba(56,189,248,0.75);
    }
    .sub-title {
      font-size: 0.74rem;
      text-align: center;
      margin-bottom: 12px;
      color: #e5e7eb;
      text-transform: lowercase;
      opacity: 0.9;
    }

    /* LABEL BAGIAN – TERANG */
    .section-title {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 12px;
      margin-top: 10px;
      text-transform: capitalize;
      background: linear-gradient(90deg,
                    rgba(248, 250, 252, 0.20),
                    rgba(129, 140, 248, 0.80),
                    rgba(56, 189, 248, 0.85));
      border-radius: 999px;
      border: 1px solid rgba(191, 219, 254, 0.95);
      color: #0f172a;
      display: inline-block;
      box-shadow:
        0 6px 14px rgba(15,23,42,0.9),
        0 0 12px rgba(56,189,248,0.75);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-top: 5px;
    }
    td {
      border-bottom: 1px solid rgba(30,64,175,0.35);
      padding: 5px 4px;
      background: transparent;
    }
    tr:last-child td { border-bottom: none; }

    /* LABEL VOUCHER – UNGU MUDA */
    td.label {
      width: 45%;
      color: #e9d5ff;      /* lilac */
      padding-left: 2px;
      text-transform: capitalize;
    }

    .cell-input,
    .cell-output {
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 0.82rem;
      padding: 5px 9px;
      background: transparent;
      color: #f9fafb;
    }

    /* INPUT BISA DIISI */
    .editable {
      background: radial-gradient(circle at top left,
                    rgba(248,250,252,0.12),
                    rgba(15,23,42,0.96));
      box-shadow:
        inset 0 0 0 1px rgba(148,163,184,0.55),
        0 3px 9px rgba(15,23,42,0.95);
      transition: box-shadow 0.18s ease, transform 0.18s ease;
    }
    .editable input { color: #f9fafb; }
    .editable input:focus {
      outline: none;
      box-shadow: 0 0 0 1px rgba(96,165,250,0.9);
      background: rgba(15,23,42,0.94);
    }
    .editable:focus-within {
      box-shadow:
        0 0 0 1px rgba(129,140,248,0.95),
        0 0 18px rgba(59,130,246,0.65);
      transform: translateY(-1px);
    }

    /* OUTPUT – BADGE BIRU ANIMASI */
    .readonly {
      background: linear-gradient(120deg, #60a5fa, #22c1c3, #38bdf8);
      background-size: 200% 200%;
      animation: pill-move 8s ease-in-out infinite;
      box-shadow:
        0 4px 12px rgba(15,23,42,0.9),
        0 0 0 1px rgba(191,219,254,0.95);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .readonly input {
      pointer-events: none;
      color: #0f172a;
      font-weight: 600;
      text-align: right;
    }
    .readonly:hover {
      transform: translateY(-1px);
      box-shadow:
        0 6px 16px rgba(15,23,42,0.95),
        0 0 0 1px rgba(248,250,252,1);
    }

    @keyframes pill-move {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* TOMBOL RESET – NEON */
    .btn-row {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.7);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 4px 10px rgba(15,23,42,0.9);
    }
    .btn-secondary {
      background: radial-gradient(circle at top left, #a7f3d0, #22c55e);
      color: #064e3b;
      box-shadow:
        0 0 12px rgba(52,211,153,0.9),
        0 8px 18px rgba(15,23,42,0.7);
    }
    .btn-secondary:hover {
      background: radial-gradient(circle at top left, #bbf7d0, #22c55e);
      box-shadow:
        0 0 18px rgba(52,211,153,1),
        0 10px 22px rgba(15,23,42,0.9);
    }

    .hint {
      font-size: 0.72rem;
      color: #e5e7eb;
      margin-top: 6px;
      text-align: right;
    }

    @media (max-width: 480px) {
      body { padding: 16px 8px; }
      .sheet {
        border-radius: 20px;
        padding: 12px 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="sheet-wrapper">
    <div class="sheet">
      <h1>MathSolver</h1>

      <!-- JUMLAH AWAL VOUCHER -->
      <div class="section-title">Jumlah Awal Voucher</div>
      <table>
        <tr>
          <td class="label">Voucher 5</td>
          <td class="cell-input editable">
            <input type="number" id="awal5" value="0"
                   onfocus="clearZero(this)" onblur="restoreZero(this)" oninput="hitung()">
          </td>
        </tr>
        <tr>
          <td class="label">Voucher 20</td>
          <td class="cell-input editable">
            <input type="number" id="awal20" value="0"
                   onfocus="clearZero(this)" onblur="restoreZero(this)" oninput="hitung()">
          </td>
        </tr>
      </table>

      <!-- SISA VOUCHER -->
      <div class="section-title">Sisa Voucher</div>
      <table>
        <tr>
          <td class="label">Voucher 5</td>
          <td class="cell-input editable">
            <input type="number" id="sisa5" value="0"
                   onfocus="clearZero(this)" onblur="restoreZero(this)" oninput="hitung()">
          </td>
        </tr>
        <tr>
          <td class="label">Voucher 20</td>
          <td class="cell-input editable">
            <input type="number" id="sisa20" value="0"
                   onfocus="clearZero(this)" onblur="restoreZero(this)" oninput="hitung()">
          </td>
        </tr>
      </table>

      <!-- LAKU (OUTPUT) -->
      <div class="section-title">Laku</div>
      <table>
        <tr>
          <td class="label">Voucher 5</td>
          <td class="cell-output readonly">
            <input type="text" id="laku5" value="0" readonly>
          </td>
        </tr>
        <tr>
          <td class="label">Voucher 20</td>
          <td class="cell-output readonly">
            <input type="text" id="laku20" value="0" readonly>
          </td>
        </tr>
      </table>

      <!-- PEMBAYARAN (OUTPUT) -->
      <div class="section-title">Pembayaran</div>
      <table>
        <tr>
          <td class="label">Voucher 5</td>
          <td class="cell-output readonly">
            <input type="text" id="bayar5" value="Rp 0" readonly>
          </td>
        </tr>
        <tr>
          <td class="label">Voucher 20</td>
          <td class="cell-output readonly">
            <input type="text" id="bayar20" value="Rp 0" readonly>
          </td>
        </tr>
        <tr>
          <td class="label">Total</td>
          <td class="cell-output readonly">
            <input type="text" id="bayarTotal" value="Rp 0" readonly>
          </td>
        </tr>
      </table>

      <!-- TAMBAHAN VOUCHER -->
      <div class="section-title">Tambahan Voucher</div>
      <table>
        <tr>
          <td class="label">Voucher 5</td>
          <td class="cell-input editable">
            <input type="number" id="tambah5" value="0"
                   onfocus="clearZero(this)" onblur="restoreZero(this)" oninput="hitung()">
          </td>
        </tr>
        <tr>
          <td class="label">Voucher 20</td>
          <td class="cell-input editable">
            <input type="number" id="tambah20" value="0"
                   onfocus="clearZero(this)" onblur="restoreZero(this)" oninput="hitung()">
          </td>
        </tr>
      </table>

      <!-- TOTAL JUMLAH VOUCHER (OUTPUT) -->
      <div class="section-title">Total Jumlah Voucher</div>
      <table>
        <tr>
          <td class="label">Voucher 5</td>
          <td class="cell-output readonly">
            <input type="text" id="totalVoucher5" value="0" readonly>
          </td>
        </tr>
        <tr>
          <td class="label">Voucher 20</td>
          <td class="cell-output readonly">
            <input type="text" id="totalVoucher20" value="0" readonly>
          </td>
        </tr>
      </table>

      <div class="btn-row">
        <button class="btn-secondary" onclick="resetForm()">♻ Reset</button>
      </div>

      </div>
    </div>
  </div>

  <script>
    function clearZero(el) {
      if (el.value === "0") el.value = "";
    }
    function restoreZero(el) {
      if (el.value === "") el.value = "0";
    }
    function toInt(val) {
      return parseInt(val) || 0;
    }
    function formatRupiah(angka) {
      return "Rp " + angka.toLocaleString("id-ID");
    }

    function hitung() {
      const awal5   = toInt(document.getElementById("awal5").value);
      const awal20  = toInt(document.getElementById("awal20").value);
      const sisa5   = toInt(document.getElementById("sisa5").value);
      const sisa20  = toInt(document.getElementById("sisa20").value);
      const tambah5 = toInt(document.getElementById("tambah5").value);
      const tambah20= toInt(document.getElementById("tambah20").value);

      // Laku = Awal - Sisa (tambahan tidak masuk pembayaran)
      const l5  = awal5  - sisa5;
      const l20 = awal20 - sisa20;

      const laku5  = l5  < 0 ? 0 : l5;
      const laku20 = l20 < 0 ? 0 : l20;

      document.getElementById("laku5").value  = laku5;
      document.getElementById("laku20").value = laku20;

      // Pembayaran: hanya dari voucher laku
      const bayar5  = laku5  * 4000;
      const bayar20 = laku20 * 19000;
      const total   = bayar5 + bayar20;

      document.getElementById("bayar5").value     = formatRupiah(bayar5);
      document.getElementById("bayar20").value    = formatRupiah(bayar20);
      document.getElementById("bayarTotal").value = formatRupiah(total);

      // Total jumlah voucher: Sisa + Tambahan (sesuai permintaan)
      const totalV5  = sisa5  + tambah5;
      const totalV20 = sisa20 + tambah20;

      document.getElementById("totalVoucher5").value  = totalV5;
      document.getElementById("totalVoucher20").value = totalV20;
    }

    function resetForm() {
      const idsEditable = ["awal5","awal20","sisa5","sisa20","tambah5","tambah20"];
      idsEditable.forEach(id => document.getElementById(id).value = "0");

      document.getElementById("laku5").value  = "0";
      document.getElementById("laku20").value = "0";
      document.getElementById("bayar5").value     = "Rp 0";
      document.getElementById("bayar20").value    = "Rp 0";
      document.getElementById("bayarTotal").value = "Rp 0";
      document.getElementById("totalVoucher5").value  = "0";
      document.getElementById("totalVoucher20").value = "0";
    }

    hitung();
  </script>
</body>
</html>
